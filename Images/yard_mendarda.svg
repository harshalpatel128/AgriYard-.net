<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="menGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a8d8b9"/>
      <stop offset="100%" stop-color="#ebf7ee"/>
    </linearGradient>
  </defs>

  <rect width="400" height="240" fill="url(#menGrad)" />

  <!-- Mendarda Yard Gate - matches yellow gate in PDF screenshot -->
  <polygon points="40,80 360,80 340,55 60,55" fill="#fbc02d" />
  <rect x="70" y="58" width="260" height="18" rx="2" fill="#1b5e20" />
  <text x="200" y="71" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">MENDARDA MARKETING YARD</text>

  <!-- Pillars in yellow/orange -->
  <rect x="50" y="80" width="18" height="110" fill="#fbc02d" />
  <rect x="332" y="80" width="18" height="110" fill="#fbc02d" />

  <!-- Background Yard Building -->
  <rect x="80" y="100" width="240" height="70" fill="#e8cca4" />
  <!-- Windows / shutter doors -->
  <rect x="100" y="120" width="30" height="40" fill="#5c483d" />
  <rect x="150" y="120" width="30" height="40" fill="#5c483d" />
  <rect x="200" y="120" width="30" height="40" fill="#5c483d" />
  <rect x="250" y="120" width="30" height="40" fill="#5c483d" />

  <!-- Ground -->
  <rect x="0" y="170" width="400" height="70" fill="#c2bfae" />

  <!-- Bags in front -->
  <ellipse cx="80" cy="195" rx="36" ry="16" fill="#c49f6b" />
  <ellipse cx="160" cy="195" rx="36" ry="16" fill="#c49f6b" />
  <ellipse cx="240" cy="195" rx="36" ry="16" fill="#c49f6b" />
  <ellipse cx="320" cy="195" rx="36" ry="16" fill="#c49f6b" />

  <rect x="15" y="15" width="85" height="24" rx="12" fill="rgba(255,255,255,0.9)" />
  <circle cx="27" cy="27" r="6" fill="#2e7d32" />
  <text x="39" y="31" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" fill="#1b5e20">95+ SHOPS</text>
</svg>
