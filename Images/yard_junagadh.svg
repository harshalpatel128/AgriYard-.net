<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="junaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8ac791"/>
      <stop offset="100%" stop-color="#d6ebd9"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#54433b"/>
      <stop offset="100%" stop-color="#2d211a"/>
    </linearGradient>
  </defs>

  <rect width="400" height="240" fill="url(#junaGrad)" />
  <!-- Girnar hill silhouette in background for Junagadh -->
  <polygon points="50,110 140,50 220,110" fill="#75a87b" opacity="0.6"/>
  <polygon points="180,110 270,60 360,110" fill="#6a9e70" opacity="0.5"/>

  <!-- Junagadh APMC Shed Structure -->
  <rect x="0" y="80" width="400" height="18" fill="url(#roofGrad)" />
  <polygon points="0,80 200,50 400,80" fill="#3b2b22" />
  
  <rect x="25" y="98" width="10" height="90" fill="#54433b" />
  <rect x="110" y="98" width="10" height="90" fill="#54433b" />
  <rect x="195" y="98" width="10" height="90" fill="#54433b" />
  <rect x="280" y="98" width="10" height="90" fill="#54433b" />
  <rect x="365" y="98" width="10" height="90" fill="#54433b" />

  <!-- Signboard -->
  <rect x="90" y="52" width="220" height="22" rx="3" fill="#1b5e20" />
  <text x="200" y="67" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">JUNAGADH MARKETING YARD</text>

  <!-- Ground -->
  <rect x="0" y="160" width="400" height="80" fill="#c4c1b4" />

  <!-- Bags and Auction lots -->
  <ellipse cx="60" cy="180" rx="35" ry="16" fill="#c8a472" />
  <ellipse cx="130" cy="180" rx="35" ry="16" fill="#c8a472" />
  <ellipse cx="200" cy="180" rx="35" ry="16" fill="#c8a472" />
  <ellipse cx="270" cy="180" rx="35" ry="16" fill="#c8a472" />
  <ellipse cx="340" cy="180" rx="35" ry="16" fill="#c8a472" />

  <ellipse cx="95" cy="198" rx="42" ry="19" fill="#d8b482" />
  <ellipse cx="180" cy="199" rx="42" ry="19" fill="#d8b482" />
  <ellipse cx="265" cy="198" rx="42" ry="19" fill="#d8b482" />
  <ellipse cx="350" cy="197" rx="42" ry="19" fill="#d8b482" />

  <rect x="15" y="15" width="90" height="24" rx="12" fill="rgba(255,255,255,0.9)" />
  <circle cx="27" cy="27" r="6" fill="#2e7d32" />
  <text x="39" y="31" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" fill="#1b5e20">180+ SHOPS</text>
</svg>
