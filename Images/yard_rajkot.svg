<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7fc186"/>
      <stop offset="60%" stop-color="#b8e2be"/>
      <stop offset="100%" stop-color="#eaf5eb"/>
    </linearGradient>
    <linearGradient id="shedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a3b32"/>
      <stop offset="100%" stop-color="#2c221c"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4b483"/>
      <stop offset="100%" stop-color="#a4814d"/>
    </linearGradient>
  </defs>

  <!-- Background Sky -->
  <rect width="400" height="240" fill="url(#skyGrad)" />

  <!-- Distant APMC Shed Truss Structure -->
  <rect x="0" y="60" width="400" height="15" fill="url(#shedGrad)" />
  <polygon points="0,60 200,30 400,60 400,75 200,45 0,75" fill="#382921" />

  <!-- Industrial Shed Pillars -->
  <rect x="30" y="75" width="12" height="110" fill="#5c483d" />
  <rect x="120" y="75" width="12" height="110" fill="#5c483d" />
  <rect x="210" y="75" width="12" height="110" fill="#5c483d" />
  <rect x="300" y="75" width="12" height="110" fill="#5c483d" />
  <rect x="380" y="75" width="12" height="110" fill="#5c483d" />

  <!-- APMC Header Signboard -->
  <rect x="100" y="32" width="200" height="22" rx="3" fill="#1b5e20" />
  <text x="200" y="47" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">RAJKOT APMC YARD</text>

  <!-- Ground Concrete Yard Floor -->
  <rect x="0" y="160" width="400" height="80" fill="#cfcfc4" />
  <line x1="0" y1="160" x2="400" y2="160" stroke="#a8a89c" stroke-width="2" />

  <!-- Stacks of Jute Bags (Kapas / Ghau Bags) -->
  <!-- Row 1 back -->
  <ellipse cx="60" cy="175" rx="35" ry="16" fill="url(#bagGrad)" />
  <ellipse cx="125" cy="175" rx="35" ry="16" fill="url(#bagGrad)" />
  <ellipse cx="190" cy="175" rx="35" ry="16" fill="url(#bagGrad)" />
  <ellipse cx="255" cy="175" rx="35" ry="16" fill="url(#bagGrad)" />
  <ellipse cx="320" cy="175" rx="35" ry="16" fill="url(#bagGrad)" />

  <!-- Row 2 middle stacked higher -->
  <ellipse cx="85" cy="160" rx="32" ry="15" fill="#c4a372" />
  <ellipse cx="150" cy="160" rx="32" ry="15" fill="#c4a372" />
  <ellipse cx="215" cy="160" rx="32" ry="15" fill="#c4a372" />
  <ellipse cx="280" cy="160" rx="32" ry="15" fill="#c4a372" />

  <!-- Row 3 front layer -->
  <ellipse cx="45" cy="195" rx="40" ry="18" fill="#deb887" />
  <ellipse cx="120" cy="198" rx="40" ry="18" fill="#deb887" />
  <ellipse cx="195" cy="196" rx="40" ry="18" fill="#deb887" />
  <ellipse cx="270" cy="198" rx="40" ry="18" fill="#deb887" />
  <ellipse cx="345" cy="195" rx="40" ry="18" fill="#deb887" />

  <!-- Bag Ties / Seams -->
  <line x1="25" y1="195" x2="65" y2="195" stroke="#8c6c38" stroke-dasharray="3,3" stroke-width="1.5" />
  <line x1="100" y1="198" x2="140" y2="198" stroke="#8c6c38" stroke-dasharray="3,3" stroke-width="1.5" />
  <line x1="175" y1="196" x2="215" y2="196" stroke="#8c6c38" stroke-dasharray="3,3" stroke-width="1.5" />
  <line x1="250" y1="198" x2="290" y2="198" stroke="#8c6c38" stroke-dasharray="3,3" stroke-width="1.5" />
  <line x1="325" y1="195" x2="365" y2="195" stroke="#8c6c38" stroke-dasharray="3,3" stroke-width="1.5" />

  <!-- Yard Badge Overlay -->
  <rect x="15" y="15" width="90" height="24" rx="12" fill="rgba(255,255,255,0.9)" />
  <circle cx="27" cy="27" r="6" fill="#2e7d32" />
  <text x="39" y="31" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="bold" fill="#1b5e20">250+ SHOPS</text>
</svg>
